[project]
name = "ashare-mcp"
version = "0.1.0"
description = "MCP server for Chinese A-share financial statements: pull, cross-check, peer-compare. 把 A 股财报变成 LLM 工具调用。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yli769227-jpg" }]
keywords = ["mcp", "finance", "a-share", "llm", "agent", "财报", "勾稽"]
dependencies = [
    "mcp>=1.27.0",
    "akshare>=1.18.0",
    "pandas>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# PDF / docx / pptx → markdown 解析(parse_document tool 用)。
# 单独装一次能拉几个 G(torch/transformers/onnxruntime),按需开启:
#   pip install -e ".[pdf]"
pdf = [
    "mineru>=3.1.14",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
ashare-mcp = "ashare_mcp.server:main"
ashare-mcp-http = "ashare_mcp.http_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_mcp"]
